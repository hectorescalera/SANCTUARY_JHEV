<!DOCTYPE html>
<html lang="es" class="h-full bg-surface-container-lowest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctuary JHEV - Rituales & Proyectos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'surface-container-lowest': '#0f0f0f',
                        'surface-container-low': '#161616',
                        'surface-container': '#1e1e1e',
                        'surface-container-high': '#282828',
                        'on-surface': '#e2e2e2',
                        'on-surface-variant': '#a8a8a8',
                        'primary': '#f59e0b',
                        'primary-container': 'rgba(245, 158, 11, 0.15)',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-[#121212] text-on-surface font-sans antialiased flex overflow-hidden">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="w-64 bg-[#1e1e1e] border-r border-white/5 p-6 flex flex-col justify-between shrink-0 h-screen">
        <div>
            <!-- LOGO / CABECERA -->
            <div class="mb-8">
                <h1 class="text-xl font-black tracking-wider text-primary">Sanctuary JHEV</h1>
                <p class="text-xs text-on-surface-variant/60 font-medium mt-0.5">Gestor Personal & Bitácora</p>
            </div>

            <!-- NAVEGACIÓN -->
            <nav class="space-y-1.5">
                <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-on-surface-variant hover:text-white font-medium text-sm transition">
                    <span class="material-symbols-outlined text-xl">dashboard</span>
                    <span>Dashboard</span>
                </a>
                <a href="finanzas.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-on-surface-variant hover:text-white font-medium text-sm transition">
                    <span class="material-symbols-outlined text-xl">payments</span>
                    <span>Finanzas</span>
                </a>
                <a href="rituales.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-amber-500/20 text-amber-300 font-bold text-sm tracking-wide">
                    <span class="material-symbols-outlined text-xl">auto_awesome</span>
                    <span>Rituales & Proyectos</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-on-surface-variant hover:text-white font-medium text-sm transition opacity-50 cursor-not-allowed">
                    <span class="material-symbols-outlined text-xl">edit_note</span>
                    <span>Diario Mágico</span>
                </a>
            </nav>
        </div>

        <!-- FOOTER SIDEBAR / PERFIL -->
        <div class="pt-4 border-t border-white/5 flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-primary/20 text-primary flex items-center justify-center font-extrabold text-sm border border-primary/30">
                P
            </div>
            <div class="overflow-hidden">
                <p class="text-xs font-bold text-white truncate">Iniciado</p>
                <p class="text-[10px] text-on-surface-variant/60 truncate">Modo Activo</p>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 overflow-y-auto h-screen p-8 bg-[#121212]">
        
        <!-- HEADER PRINCIPAL -->
        <header class="flex items-center justify-between mb-8 pb-4 border-b border-white/5">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary text-2xl">auto_awesome</span>
                <h2 class="text-xl font-bold text-white tracking-wide">Rituales & Proyectos</h2>
            </div>
        </header>

        <!-- GRID PRINCIPAL FORMULARIO / LISTA -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- FORMULARIO REGISTRO -->
            <div class="p-6 rounded-2xl bg-[#1e1e1e] border border-white/5 shadow-xl h-fit">
                <h3 class="text-lg font-bold text-white mb-4">Nuevo Registro</h3>
                
                <form id="form-rituales" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-on-surface-variant mb-1">Tipo de Actividad</label>
                        <select id="select-tipo-act" class="w-full bg-[#121212] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-primary">
                            <option value="proyecto">Proyecto Técnico/Personal</option>
                            <option value="ritual">Ritual Magia</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-on-surface-variant mb-1">Nombre o Título</label>
                        <input type="text" id="input-nombre-act" placeholder="Ej. Landing Page Le Garbo, Ritual Cashbook" class="w-full bg-[#121212] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-primary" required>
                    </div>

                    <!-- CAMPOS DINÁMICOS PARA RITUAL -->
                    <div id="campos-ritual" class="hidden space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-on-surface-variant mb-1">Duración Estimada (Días)</label>
                            <input type="number" id="input-duracion" placeholder="7" value="7" class="w-full bg-[#121212] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-primary">
                        </div>
                    </div>

                    <!-- CAMPOS DINÁMICOS PARA PROYECTO (CON DESPLEGABLE DE ENLACES) -->
                    <div id="campos-proyecto" class="space-y-4">
                        <details class="group border border-white/10 rounded-xl bg-[#121212] overflow-hidden">
                            <summary class="flex items-center justify-between p-3 text-xs font-semibold text-white/70 cursor-pointer select-none hover:text-white">
                                <span>Enlaces Web / Repositorio (Opcional)</span>
                                <span class="material-symbols-outlined text-sm group-open:rotate-180 transition-transform">expand_more</span>
                            </summary>
                            <div class="p-3 pt-0 space-y-3 border-t border-white/5 mt-1">
                                <div>
                                    <label class="block text-[11px] font-medium text-on-surface-variant mb-1">Enlace Live (Despliegue)</label>
                                    <input type="url" id="input-link-live" placeholder="https://..." class="w-full bg-[#1e1e1e] border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-medium text-on-surface-variant mb-1">Enlace Repositorio (GitHub/Replit)</label>
                                    <input type="url" id="input-link-repo" placeholder="https://github.com/..." class="w-full bg-[#1e1e1e] border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-primary">
                                </div>
                            </div>
                        </details>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-on-surface-variant mb-1">Fecha Inicio</label>
                        <input type="date" id="input-fecha-act" class="w-full bg-[#121212] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-primary">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-on-surface-variant mb-1">Notas / Intención</label>
                        <textarea id="input-notas-act" placeholder="Detalles, objetivos o notas de la actividad..." rows="2" class="w-full bg-[#121212] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-primary"></textarea>
                    </div>

                    <button type="submit" class="w-full py-3 rounded-xl bg-primary hover:bg-amber-600 text-black font-bold text-sm tracking-wide transition shadow-lg mt-2">
                        Registrar Actividad
                    </button>
                </form>
            </div>

            <!-- LISTADO DE ACTIVIDADES -->
            <div class="lg:col-span-2 space-y-6">
                <h3 class="text-lg font-bold text-white mb-2">Panel de Control Activo</h3>
                <div id="actividades-lista" class="space-y-4">
                    <!-- Tarjetas de Rituales y Proyectos dinámicas -->
                </div>
            </div>
        </section>

    </main>

    <!-- SCRIPT PRINCIPAL UNIFICADO -->
    <script src="app.js"></script>
</body>
</html>
