<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        /* Custom scrollbar for horizontal chip list */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Glassmorphism utility classes based on guidelines */
        .glass-card {
            background: linear-gradient(180deg, #1F1F1F 0%, #1A1A1A 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .amber-glow {
            box-shadow: 0px 0px 20px rgba(255, 191, 0, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-24 selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden md:hidden">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background border-b border-white/5 bg-background/80 backdrop-blur-md flex justify-between items-center px-container-padding h-16 w-full sticky top-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary" data-icon="account_balance_wallet" data-weight="fill" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary dark:text-primary tracking-tighter">Dashboard Personal</h1>
</div>
<button class="font-label-sm text-label-sm text-primary dark:text-primary hover:text-primary-fixed-dim transition-colors flex items-center gap-1 border border-primary/30 rounded-full px-3 py-1.5 active:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[16px]" data-icon="download">download</span>
            Import
        </button>
</header>
<main class="px-container-padding py-stack-md flex flex-col gap-stack-lg">
<!-- Quick Entry Form Card -->
<section class="glass-card rounded-xl p-6 flex flex-col gap-stack-md relative overflow-hidden">
<!-- Decorative gradient blur -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">New Entry</h2>
<form class="flex flex-col gap-stack-sm">
<!-- Amount Input -->
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-display-lg-mobile text-display-lg-mobile opacity-80">$</span>
<input class="w-full bg-[#0A0A0A] border-y-0 border-r-0 border-l-2 border-l-surface-container-high focus:border-l-primary-container text-on-surface font-display-lg-mobile text-display-lg-mobile py-4 pl-12 pr-4 rounded-r-lg focus:ring-0 transition-colors placeholder:text-on-surface-variant/30" placeholder="0.00" type="number"/>
</div>
<!-- Date Picker (Simplified styled input) -->
<div class="relative mt-2">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/50 text-[18px]" data-icon="calendar_today">calendar_today</span>
<input class="w-full bg-[#0A0A0A] border border-white/5 rounded-lg py-3 pl-10 pr-4 text-body-md text-on-surface focus:ring-1 focus:ring-primary/50 focus:border-primary/50" type="date" value="2023-10-24"/>
</div>
<!-- Category Chips (Horizontal Scroll) -->
<div class="mt-4">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-2 block">Category</label>
<div class="flex overflow-x-auto gap-2 pb-2 no-scrollbar">
<!-- Active Chip -->
<button class="flex-shrink-0 bg-primary-container/10 border border-primary-container/30 text-primary-container px-4 py-2 rounded-full font-label-sm text-label-sm flex items-center gap-1 whitespace-nowrap transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]" data-icon="school">school</span>
                            Classes
                        </button>
<!-- Inactive Chips -->
<button class="flex-shrink-0 bg-[#0A0A0A] border border-white/10 text-on-surface-variant px-4 py-2 rounded-full font-label-sm text-label-sm flex items-center gap-1 whitespace-nowrap hover:border-primary/30 transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]" data-icon="work">work</span>
                            Gigs
                        </button>
<button class="flex-shrink-0 bg-[#0A0A0A] border border-white/10 text-on-surface-variant px-4 py-2 rounded-full font-label-sm text-label-sm flex items-center gap-1 whitespace-nowrap hover:border-primary/30 transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]" data-icon="handshake">handshake</span>
                            Services
                        </button>
<button class="flex-shrink-0 bg-[#0A0A0A] border border-white/10 text-on-surface-variant px-4 py-2 rounded-full font-label-sm text-label-sm flex items-center gap-1 whitespace-nowrap hover:border-primary/30 transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]" data-icon="point_of_sale">point_of_sale</span>
                            Sales
                        </button>
<button class="flex-shrink-0 bg-[#0A0A0A] border border-white/10 text-on-surface-variant px-4 py-2 rounded-full font-label-sm text-label-sm flex items-center gap-1 whitespace-nowrap hover:border-primary/30 transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]" data-icon="volunteer_activism">volunteer_activism</span>
                            Tips
                        </button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full bg-primary-container text-[#000000] font-label-sm text-label-sm py-4 rounded-lg flex items-center justify-center gap-2 amber-glow hover:bg-primary transition-all active:scale-95" type="submit">
<span class="material-symbols-outlined text-[18px]" data-icon="add">add</span>
                    Add Income
                </button>
</form>
</section>
<!-- Income Ledger Section -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-display-lg-mobile text-[24px] leading-tight text-on-surface border-b border-white/5 pb-2">Income Ledger</h2>
<div class="flex flex-col gap-2 mt-2">
<!-- Ledger Item 1 -->
<div class="glass-card rounded-lg p-4 flex items-center justify-between group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary border border-white/5">
<span class="material-symbols-outlined" data-icon="school">school</span>
</div>
<div>
<p class="font-body-md text-on-surface leading-tight">Classes</p>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Oct 24, 2023</p>
</div>
</div>
<div class="flex items-center gap-4">
<span class="font-body-md text-primary font-semibold">+$150.00</span>
<div class="flex gap-1 opacity-60">
<button class="p-1 hover:text-primary transition-colors rounded"><span class="material-symbols-outlined text-[16px]" data-icon="edit">edit</span></button>
<button class="p-1 hover:text-error transition-colors rounded"><span class="material-symbols-outlined text-[16px]" data-icon="delete">delete</span></button>
</div>
</div>
</div>
<!-- Ledger Item 2 -->
<div class="glass-card rounded-lg p-4 flex items-center justify-between group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant border border-white/5">
<span class="material-symbols-outlined" data-icon="work">work</span>
</div>
<div>
<p class="font-body-md text-on-surface leading-tight">Gigs</p>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Oct 22, 2023</p>
</div>
</div>
<div class="flex items-center gap-4">
<span class="font-body-md text-on-surface font-semibold">+$45.50</span>
<div class="flex gap-1 opacity-60">
<button class="p-1 hover:text-primary transition-colors rounded"><span class="material-symbols-outlined text-[16px]" data-icon="edit">edit</span></button>
<button class="p-1 hover:text-error transition-colors rounded"><span class="material-symbols-outlined text-[16px]" data-icon="delete">delete</span></button>
</div>
</div>
</div>
<!-- Ledger Item 3 -->
<div class="glass-card rounded-lg p-4 flex items-center justify-between group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant border border-white/5">
<span class="material-symbols-outlined" data-icon="handshake">handshake</span>
</div>
<div>
<p class="font-body-md text-on-surface leading-tight">Services</p>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Oct 18, 2023</p>
</div>
</div>
<div class="flex items-center gap-4">
<span class="font-body-md text-on-surface font-semibold">+$300.00</span>
<div class="flex gap-1 opacity-60">
<button class="p-1 hover:text-primary transition-colors rounded"><span class="material-symbols-outlined text-[16px]" data-icon="edit">edit</span></button>
<button class="p-1 hover:text-error transition-colors rounded"><span class="material-symbols-outlined text-[16px]" data-icon="delete">delete</span></button>
</div>
</div>
</div>
</div>
<button class="mt-2 w-full py-3 border border-white/10 rounded-lg text-on-surface-variant font-label-sm text-label-sm hover:border-primary/30 hover:text-primary transition-colors">
                View All History
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container dark:bg-surface-container font-label-sm text-label-sm font-display-lg-mobile text-display-lg-mobile text-primary docked full-width bottom-0 rounded-t-xl bg-surface-container-high/90 backdrop-blur-xl border-t border-white/5 shadow-[0_-4px_20px_rgba(0,0,0,0.4)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe">
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span>Home</span>
</a>
<a class="flex flex-col items-center justify-center text-primary bg-primary-container/10 rounded-xl px-4 py-1 shadow-[0_0_15px_rgba(255,191,0,0.1)] hover:text-primary transition-all scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="receipt_long">receipt_long</span>
<span>Ledger</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="insights">insights</span>
<span>Insights</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span>Settings</span>
</a>
</nav>
</body></html>
